{% extends "base.html" %}
{% block title %}Change password · VAPT Tracker{% endblock %}
{% block body %}
<h1>Change password</h1>
{% if must_change %}
<p class="lede">Please set a new password before continuing.</p>
{% else %}
<p class="lede">Update the password for your account.</p>
{% endif %}
<div class="panel" style="max-width:460px">
  <form method="post">
    <div class="login-field"><label>Current password</label><input type="password" name="current" required></div>
    <div class="login-field"><label>New password (at least 8 characters)</label><input type="password" name="new" required></div>
    <div class="login-field"><label>Confirm new password</label><input type="password" name="confirm" required></div>
    <button class="btn primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
